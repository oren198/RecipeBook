# The database and uploads are not published to the host.
# Only the TLS proxy listens publicly. Do not add `down -v`.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-recipes}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [internal]
    security_opt: ["no-new-privileges:true"]

  app:
    build: .
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-recipes}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
      SETUP_SECRET: ${SETUP_SECRET:?set SETUP_SECRET}
      UPLOAD_DIR: /data/uploads
      NODE_ENV: production
      TRUST_PROXY: "1"
      PORT: "3000"
      RECIPE_EXTRACT_PROVIDER: ${RECIPE_EXTRACT_PROVIDER:-none}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_MAX_TOKENS: ${OPENROUTER_MAX_TOKENS:-1800}
      OPENROUTER_TIMEOUT_MS: ${OPENROUTER_TIMEOUT_MS:-25000}
      OPENROUTER_APP_TITLE: ${OPENROUTER_APP_TITLE:-Family Recipe Book}
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 25s
    restart: unless-stopped
    networks: [internal]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    read_only: false

  proxy:
    image: caddy:2
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS to the public hostname}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    networks: [internal]
    cap_drop: ["ALL"]
    cap_add: ["NET_BIND_SERVICE"]
    security_opt: ["no-new-privileges:true"]

volumes:
  pgdata:
  uploads:
  caddy-data:
  caddy-config:

networks:
  internal:
    driver: bridge
